name: jlink

# Builds the Preferenzr jlink images for all supported platforms.
# On a version tag push (e.g. 1.0.16) the images are attached to a GitHub Release.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: jlink ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: windows-x64
            os: windows-2025
          - platform: macos-aarch64
            os: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 25 (latest)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.16

      - name: Show versions
        run: |
          java -version
          mvn -v

      - name: Build jlink image
        run: mvn -B -ntp -Prelease,jlink clean install

      - name: Rename image
        run: |
          shopt -s nullglob
          zips=(jlink/target/preferenzr-jlink-client-*-jlink.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "expected exactly one jlink zip, found: ${zips[*]}" >&2
            exit 1
          fi
          # version-free name, so .../releases/latest/download/<name> stays stable
          mkdir -p dist
          cp "${zips[0]}" "dist/preferenzr-${{ matrix.platform }}.zip"
          ls -l dist

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: preferenzr-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download images
        uses: actions/download-artifact@v8
        with:
          pattern: preferenzr-*
          merge-multiple: true
          path: dist

      - name: Create release and upload images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Preferenzr $TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/*.zip --clobber
